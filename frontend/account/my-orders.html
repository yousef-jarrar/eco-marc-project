<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My orders | Eco Marc</title>

    <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/checkout.css">
</head>
<body>
    <main class="checkout-page">
        <div class="checkout-container">

            <div class="checkout-top">
                <a href="index.html" class="back-link">
                    <span aria-hidden="true">&larr;</span>
                    Back to shop
                </a>

                <p class="checkout-brand">ECO <span>MARC</span></p>
            </div>

            <div class="checkout-heading">
                <p class="eyebrow">YOUR ACCOUNT</p>
                <h1>My orders</h1>
                <p class="muted">Orders you have placed.</p>
            </div>

            <section class="panel">
                <div class="panel-heading">
                    <h2>Order list</h2>
                    <span id="orders-count" class="muted"></span>
                </div>

                <div id="loading-message" class="loading">Loading your orders...</div>

                <div id="error-message" class="error-banner" hidden>
                    <p id="error-text">Could not load your orders.</p>
                    <button type="button" id="retry-button">Try again</button>
                </div>

                <div id="empty-message" class="empty-state" hidden>
                    <h3>No orders yet</h3>
                    <p class="muted">When you place an order it will show here.</p>
                    <a href="index.html" class="text-link">Start shopping</a>
                </div>

                <div id="orders-content" hidden>
                    <div style="overflow-x:auto;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Subtotal</th>
                                    <th>Discount</th>
                                    <th>Delivery</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table"></tbody>
                        </table>
                    </div>

                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;">
                        <span id="page-number" class="muted">Page 1</span>
                        <div style="display:flex;gap:.5rem;">
                            <button type="button" id="previous-btn" disabled>Previous</button>
                            <button type="button" id="next-btn">Next</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../assets/js/my-orders.js"></script>
</body>
</html>
