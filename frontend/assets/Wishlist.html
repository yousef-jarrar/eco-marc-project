<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | LUMIÈRE</title>
<link rel="stylesheet" href="/eco-marc-project/frontend/assets/css/fonts.css">
<link rel="stylesheet" href="/eco-marc-project/frontend/assets/css/index.css">
<link rel="stylesheet" href="/eco-marc-project/frontend/assets/css/wishlist.css">
<link rel="stylesheet" href="/eco-marc-project/frontend/assets/vendor/fontawesome.min.css">
</head>

<body>

    <main class="wishlist-container">

        <section class="wishlist-intro">
            <p class="wishlist-label">YOUR CURATED EDIT</p>

            <h1>Worth coming back to.</h1>

            <p class="wishlist-description">
                Your saved pieces, together in one place.
            </p>
        </section>

        <section class="wishlist-products">

            <div class="wishlist-top">
                <h2>Saved pieces</h2>
                <span id="wishlistCount">0 items</span>
            </div>

            <div id="wishlistMessage" role="status"></div>

            <div class="wishlist-grid" id="wishlistGrid"></div>

        </section>

    </main>

    <script src="/eco-marc-project/frontend/assets/js/wishlist.js"></script>

</body>

</html>
