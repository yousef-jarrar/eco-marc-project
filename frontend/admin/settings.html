<!doctype html>
<html lang="en" class="auth-checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title> LUMIÈRE | Settings | </title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/fontawesome.min.css">
  <link rel="stylesheet" href="../assets/css/index.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="../assets/css/admin-settings.css">
  <style>html.auth-checking body { visibility: hidden; }</style>
    
  <script src="../assets/js/auth.js?v=20261029-mergefix2"></script>
<link rel="icon" type="image/svg+xml" href="../../assets/lumiere-icon-light.svg">
</head>
<body data-page="settings" class="settings-page">
  <a class="sr-only" href="#main">Skip to content</a>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close navigation" hidden></button>
  <aside class="admin-sidebar" id="admin-sidebar">
    <div id="sidebar-content"></div>
  </aside>

  <div class="admin-shell">
    <header class="admin-topbar">
      <span class="topbar-path">LUMIÈRE / Settings</span>
    </header>
    <main class="admin-main" id="main">
<div class="page-heading settings-heading">
               <h1>The details that make it yours.</h1>
               <p>Manage delivery preferences for your store.</p>
            </div>

            <div class="error-banner" id="settingsError" role="alert" hidden>
                <strong>Settings are unavailable.</strong>
                <p id="settingsErrorText"></p>
                <button type="button" class="secondary" id="retrySettingsBtn">Retry</button>
            </div>
            <div class="settings-card">
               <h2 class="settings-section-title">Delivery preferences</h2>
               
                <form id="settingsForm">

                    <div class="form-group">
                        <label for="deliveryFee">
                            Standard delivery fee (JOD)
                        </label>

                        <input
                            type="number"
                            id="deliveryFee"
                            name="delivery_fee"
                            min="0"
                            step="0.01"
                            value=""
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="freeDeliveryThreshold">
                            Free delivery threshold (JOD, optional)
                        </label>

                        <input
                            type="number"
                            id="freeDeliveryThreshold"
                            name="free_delivery_threshold"
                            min="0"
                            step="0.01"
                            value=""
                        >
                    </div>

                    <p class="settings-info">
                        Currency: JOD · Shipping region: Jordan
                    </p>

                    <button type="submit" id="saveSettingsBtn">
                        Save preferences
                    </button>

                </form>

            </div>
    </main>
  </div>

  
  
  
  
  <script src="../assets/vendor/sweetalert2.all.min.js"></script>
<script src="../assets/js/admin-api.js?v=20261029-scriptfix"></script>
<script src="../assets/js/alerts.js?v=20261029-scriptfix"></script>
<script src="../assets/js/admin-layout.js?v=20261029-landing"></script>
<script type="module" src="../assets/js/settings.js?v=20261029-session2"></script>
</body>
</html>
