<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | Eco Marc Admin</title>

    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/admin-settings.css">
</head>

<body>

    <div class="admin-container">

        <aside class="sidebar"></aside>

        <main class="main-content">

            <div class="settings-header">
               <h1>The details that make it yours.</h1>
               <p>Store preferences are saved to this browser.</p>
            </div>

            <div class="settings-card">
               <h2 class="settings-section-title">Delivery & inventory</h2>
               
                <form id="settingsForm">

                    <div class="form-group">
                        <label for="deliveryFee">
                            Standard delivery fee (JOD)
                        </label>

                        <input
                            type="number"
                            id="deliveryFee"
                            name="delivery_fee"
                            min="0"
                            step="0.01"
                            value="4"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="freeDeliveryThreshold">
                            Free delivery threshold (JOD)
                        </label>

                        <input
                            type="number"
                            id="freeDeliveryThreshold"
                            name="free_delivery_threshold"
                            min="0"
                            step="0.01"
                            value="100.09"
                            required
                        >
                    </div>

                    <p class="settings-info">
                        Currency: JOD · Shipping region: Jordan
                    </p>

                    <button type="submit" id="saveSettingsBtn">
                        Save preferences
                    </button>

                </form>

            </div>

        </main>

    </div>

    <script type="module" src="../assets/js/settings.js"></script>

</body>
</html>
