<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories | Eco Marc Admin</title>

    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/admin-categories.css">
</head>

<body>

    <div class="admin-container">

        <aside class="sidebar"></aside>

        <main class="main-content">

            <div class="categories-header">
                <div>
                    <h1>A place for every piece.</h1>
                    <p>Organize the collection without losing its point of view.</p>
                </div>

                <button type="button" id="addCategoryBtn">
                    + Add category
                </button>
            </div>

            <div class="categories-card">

                <div class="categories-search">
                    <input
                        type="search"
                        id="searchCategory"
                        placeholder="Search categories..."
                        aria-label="Search categories"
                    >
                </div>

                <div class="table-scroll">
                    <table class="categories-table">

                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Products</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="categoriesTableBody"></tbody>

                    </table>
                </div>

            </div>

             <dialog id="categoryDialog">
             
                 <form id="categoryForm">
             
                     <h2 id="formTitle">Add Category</h2>
             
                     <input type="hidden" id="categoryId">
             
                     <label for="categoryName">Category Name</label>
                     <input
                         type="text"
                         id="categoryName"
                         required
                     >
             
                     <label for="categoryImage">Upload url Image</label>
                     <input
                         type="url"
                         id="categoryImage"
                        placeholder="https://example.com/image.jpg"
                     >
             
                     <div class="category-actions">
             
                         <button type="submit">Save</button>
             
                         <button type="button" id="cancelCategoryBtn">
                             Cancel
                         </button>
             
                     </div>
             
                 </form>
             
             </dialog>
             
        </main>

    </div>

    <script type="module" src="../assets/js/categories.js"></script>

</body>
</html>
