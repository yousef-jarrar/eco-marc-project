
<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | LUMIÈRE</title>

    <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/vendor/fontawesome.min.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/admin.css?v=20261030-audit">
    <link rel="stylesheet" href="../assets/css/order.css">

<style>html.auth-checking body { visibility: hidden; }</style>
<script src="../assets/js/auth.js?v=20261030-simplified-ai"></script>
<link rel="icon" type="image/svg+xml" href="../../assets/lumiere-icon-light.svg">
<link rel="stylesheet" href="../assets/css/sticky-header.css?v=20261029-sticky">
</head>

<body data-page="orders">
  <a class="sr-only" href="#main">Skip to content</a>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close navigation" hidden></button>
  <aside class="admin-sidebar" id="admin-sidebar">
    <div id="sidebar-content"></div>
  </aside>

  <div class="admin-shell">
    <header class="admin-topbar"><span class="topbar-path">LUMIÈRE / Orders</span></header>

    <main class="admin-main" id="main">
      <header class="page-heading">
        <div>
          <h1>Orders</h1>
          <p class="muted">View and manage customer orders.</p>
        </div>
      </header>

      <section class="panel" aria-label="Order filters" style="margin-bottom: 24px;">
        <form id="order-filters" class="order-filters">
          <div class="field">
            <label for="username">Customer name</label>
            <input type="text" id="username" name="username" placeholder="Search customers...">
          </div>
          <div class="field">
            <label for="start-date">Start date</label>
            <input type="date" id="start-date" name="start_date">
          </div>
          <div class="field">
            <label for="end-date">End date</label>
            <input type="date" id="end-date" name="end_date">
          </div>
          <div class="order-filter-actions">
            <button type="submit" id="search-btn">Search</button>
            <button type="button" id="reset-btn" class="secondary">Reset</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-label="Orders list">
        <div class="panel-heading">
          <h2>Order list</h2>
          <span id="orders-count" class="muted tiny"></span>
        </div>

        <div id="loading-message" class="loading"><span class="spinner"></span></div>

        <div id="error-message" class="error-banner" hidden>
          <p id="error-text">Could not load orders.</p>
          <button type="button" id="retry-button">Try again</button>
        </div>

        <div id="empty-message" class="empty-state" hidden>
          <h3>No orders found</h3>
          <p class="muted">Try changing the filters.</p>
        </div>

        <div id="orders-content" hidden>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th>Subtotal</th>
                  <th>Discount</th>
                  <th>Delivery</th>
                  <th>Total</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="orders-table"></tbody>
            </table>
          </div>

          <div class="order-pagination">
            <span id="page-number" class="muted">Page 1</span>
            <div class="order-filter-actions">
              <button type="button" id="previous-btn" class="secondary" disabled>Previous</button>
              <button type="button" id="next-btn">Next</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  
  <script src="../assets/vendor/sweetalert2.all.min.js"></script>
<script src="../assets/js/admin-api.js?v=20261029-scriptfix"></script>
<script src="../assets/js/alerts.js?v=20261029-scriptfix"></script>
<script src="../assets/js/admin-layout.js?v=20261030-audit"></script>
<script src="../assets/vendor/chart.umd.min.js"></script>
  
  
  
  <script src="../assets/js/order.js"></script>
</body>
</html>
