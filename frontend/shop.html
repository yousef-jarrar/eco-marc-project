<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | LUMIÈRE</title>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <link rel="stylesheet" href="assets/vendor/fontawesome.min.css">
  <script src="assets/js/auth.js"></script>
</head>
<body class="shop-page">
  <header class="shop-header">
    <a href="Landing.html" class="shop-logo">LUMIÈRE</a>
    <nav><a href="user/wishlist.html"><i class="fa-regular fa-heart"></i></a><a href="account/index.html"><i class="fa-solid fa-user"></i></a>
    <button
    type="button"
    class="nav-cart-button"
    id="store-cart-button"
    aria-label="Open shopping cart"
>
    <i class="fa-solid fa-bag-shopping"></i>
    
    <b class="nav-cart-count" id="store-cart-count" hidden>0</b>
</button>
</nav>
  </header>
  <main class="shop-container">
    <aside class="filters">
      <p class="shop-eyebrow">YOUR SELECTION</p><h2>Refine your edit</h2>
      <h3>Categories</h3><div id="categoriesList" class="categories-list"><p>Loading categories...</p></div>
      <div class="filter-field"><label for="filter-color">Color</label><select id="filter-color"><option value="">All colors</option></select></div>
      <div class="filter-field"><label for="filter-size">Size</label><select id="filter-size"><option value="">All sizes</option></select></div>
      <div class="filter-field"><label for="filter-price">Maximum price (JOD)</label><input type="number" id="filter-price" min="0" step="0.01" placeholder="e.g. 25"></div>
      <button type="button" class="clear-filters" id="clear-filters">Clear all filters</button>
    </aside>
    <section class="products-section">
      <div class="shop-top"><div><p class="shop-eyebrow">THE LUMIÈRE COLLECTION</p><h1>Shop the Collection</h1><p class="shop-subtitle">Find the pieces that feel like you.</p></div>
        <input type="search" id="filter-name" placeholder="Search the collection..." aria-label="Search products">
      </div>
      <div class="products-meta"><p id="products-count" aria-live="polite">Loading products...</p><p id="shop-message" role="status"></p></div>
      <div class="products-grid" id="product-grid"><div class="shop-loading">Loading products...</div></div>
      <div class="pagination"><button type="button" id="prev-page" class="page-btn" disabled><i class="fa-solid fa-arrow-left"></i></button><span id="page-info">Page 1</span><button type="button" id="next-page" class="page-btn" disabled><i class="fa-solid fa-arrow-right"></i></button></div>
    </section>
  </main>
  <footer class="shop-footer"><span>LUMIÈRE</span><a href="Landing.html">Back to home</a></footer>
  <script src="assets/vendor/sweetalert2.all.min.js"></script><script src="assets/js/alerts.js"></script><script src="assets/js/store-common.js"></script><script src="assets/js/store-products.js"></script>
</body></html>
