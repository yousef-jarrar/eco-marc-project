<!doctype html>
<html lang="en" class="auth-checking">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop Products | LUMIÈRE</title>
  <link rel="stylesheet" href="../assets/css/fonts.css"><link rel="stylesheet" href="../assets/css/index.css">
  <link rel="stylesheet" href="../assets/vendor/fontawesome.min.css"><link rel="stylesheet" href="../assets/css/store.css">
  <script src="../assets/js/auth.js"></script>
</head>
<body class="store-page">
  <header class="store-header"><a class="store-brand" href="../Landing.html">LUMIÈRE</a><nav><a class="active" href="products.html">Shop</a><a href="wishlist.html">Wishlist <i class="fa-regular fa-heart"></i></a><a href="../account/index.html">My Account</a></nav></header>
  <main class="store-main">
    <section class="store-intro"><p class="eyebrow">THE COLLECTION</p><h1>Find your next favourite.</h1><p>Thoughtfully selected pieces, made to fit your style.</p></section>
    <section class="shop-controls" aria-label="Filter products">
      <label>Product name<input id="filter-name" type="search" placeholder="Search products..."></label>
      <label>Category<select id="filter-category"><option value="">All categories</option></select></label>
      <label>Color<select id="filter-color"><option value="">All colors</option></select></label>
      <label>Size<select id="filter-size"><option value="">All sizes</option></select></label>
      <label>Maximum price (JOD)<input id="filter-price" type="number" min="0" step="0.01" placeholder="e.g. 5"></label>
      <button type="button" class="outline-btn" id="clear-filters">Clear filters</button>
    </section>
    <div class="shop-status"><p id="products-count" aria-live="polite">Loading products…</p><p id="shop-message" role="status"></p></div>
    <section id="product-grid" class="product-grid" aria-label="Products"><div class="store-loading">Loading products…</div></section>
    <div class="pagination"><button id="prev-page" class="outline-btn" disabled>Previous</button><span id="page-info">Page 1</span><button id="next-page" class="outline-btn" disabled>Next</button></div>
  </main>
  <footer class="store-footer"><span>LUMIÈRE</span><a href="../Landing.html">Back to home</a></footer>
  <script src="../assets/vendor/sweetalert2.all.min.js"></script><script src="../assets/js/alerts.js"></script><script src="../assets/js/store-common.js"></script><script src="../assets/js/store-products.js"></script>
</body></html>
